[package]
name = "tui-video-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
imageproc = "0.26.0"
termion = "4.0.6"
nokhwa = { version = "0.10.3", features=["input-native", "output-threaded"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.17"
ctrlc = "3.5.1"
async-rate-limiter = "1.1.0"
async-trait = "0.1.89"
triple_buffer = "8.1.1"
bincode = "2.0.0"
xcap = "0.8.1"
termcolor = { git = "https://github.com/diogogomesaraujo/termcolor.git" }
image = "0.25.9"
rcgen = "0.14.7"
s2n-quic = "1.74.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
